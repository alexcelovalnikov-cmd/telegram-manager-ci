# V31 production compose.
# All paths/images that can identify a deployment are explicit inputs.
# Keep a non-internal public network: Docker host port publication does not work when a
# service is attached only to the internal production database network. Reuse Docker
# the existing user-defined production network so every release/shadow does not allocate a
# new Compose subnet while preserving Compose DNS aliases.
name: "${TM_PROJECT_NAME:?Set a versioned production project name, for example telegram-manager-v31-production}"

services:
  api:
    image: "${TM_API_IMAGE:?Set the tested API image, for example telegram-manager:V31}"
    env_file:
      - "${TM_API_ENV_FILE:?Set the inspected base API env file}"
      - "${TM_API_DSN_FILE:?Set the least-privilege API DSN env file}"
    environment:
      TM_DYNAMIC_ENABLED: "true"
      TM_CONFIGURABLE_ENABLED: "true"
      TM_WRITES_ENABLED: "${TM_WRITES_ENABLED:-true}"
      TM_BACKGROUND_ENABLED: "${TM_BACKGROUND_ENABLED:-true}"
      TM_OAUTH_ENABLED: "${TM_OAUTH_ENABLED:-true}"
      TM_AUDIT_PATH: /state/audit.sqlite
      TM_JOBS_PATH: /state/jobs.sqlite
      TM_OAUTH_PATH: /state/oauth.json
      TM_GOOGLE_SHEETS_CREDENTIALS: /run/secrets/google-sheets.json
    ports:
      - "127.0.0.1:${TM_API_PORT:-8766}:8000"
    volumes:
      - "${TM_STATE_DIR:?Set the live production state directory}:/state"
      - "${TM_STATE_DIR:?Set the live production state directory}/google-sheets-service-account.json:/run/secrets/google-sheets.json:ro"
    networks:
      - default
      - database
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-m", "tm_api.healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 10s

  calendar:
    image: "${TM_CALENDAR_IMAGE:?Set the tested Calendar image, for example telegram-manager-calendar:V31}"
    env_file:
      - "${TM_CALENDAR_ENV_FILE:?Set the least-privilege Calendar DSN env file}"
    ports:
      - "127.0.0.1:${TM_CALENDAR_PORT:-5232}:5232"
    networks:
      - default
      - database
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-m", "tm_calendar.healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 10s

networks:
  default:
    external: true
    name: "${TM_PUBLIC_NETWORK:-telegram-manager-v53-production_default}"
  database:
    external: true
    name: "${TM_DATABASE_NETWORK:?Set the inspected production database network}"
