# A separate database, network, ports and credentials. No production mounts.
name: telegram-manager-v25-stage
services:
  db:
    image: postgres:17.11-bookworm
    env_file: ../../.staging/database.env
    volumes: [stage-db:/var/lib/postgresql/data]
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d tm_v24_test']
      interval: 5s
      timeout: 3s
      retries: 12
  db-rest:
    image: postgrest/postgrest:v14.1
    env_file: ../../.staging/rest.env
    networks: [isolated]
    depends_on:
      db: {condition: service_healthy}
  api:
    image: telegram-manager:V28
    build:
      context: ../..
      args: {BASE_IMAGE: '${BASE_IMAGE:-telegram-manager:V22}'}
    env_file: ../../.staging/api.env
    ports: ['127.0.0.1:8767:8000']
    volumes: [../../.staging/api-state:/state]
    networks: [isolated]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    depends_on:
      db: {condition: service_healthy}
  calendar:
    image: telegram-manager-calendar:V28
    build: {context: ../.., dockerfile: deploy/v25/Dockerfile.calendar}
    env_file: ../../.staging/calendar.env
    ports: ['127.0.0.1:5233:5232']
    networks: [isolated]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    depends_on:
      db: {condition: service_healthy}
  tests:
    profiles: [tests]
    image: telegram-manager-tests:V28
    build:
      context: ../..
      dockerfile: deploy/v25/Dockerfile.tests
      args: {BASE_IMAGE: '${BASE_IMAGE:-telegram-manager:V22}'}
    env_file: ../../.staging/tests.env
    networks: [isolated]
    depends_on:
      db: {condition: service_healthy}
    volumes: [../../validation:/validation]
    command: [python, -m, pytest, tests/v24, tests/v25, -q, '--junitxml=/validation/integration_V25.xml']
networks:
  isolated: {internal: true}
volumes:
  stage-db: {}
