# TEMPLATE ONLY. No database container, production mounts or credential defaults.
# V22 remains running. Resolve the network/env paths together before using this.
# Required variables deliberately prevent accidentally running with empty settings.
name: telegram-manager-v25
services:
  api:
    image: telegram-manager:V25
    env_file:
      - '${TM_V25_API_ENV_FILE:?Use an inspected private API environment file}'
      - '${TM_V25_API_DSN_FILE:?Use the least-privilege V24 API DSN file}'
    environment:
      TM_DYNAMIC_ENABLED: 'true'
      TM_CONFIGURABLE_ENABLED: 'true'
      # Keep workers off during parallel acceptance; enable only after cutover.
      TM_BACKGROUND_ENABLED: 'false'
      TM_JOBS_PATH: /state/jobs.sqlite
      TM_AUDIT_PATH: /state/audit.sqlite
      TM_OAUTH_PATH: /state/oauth.json
    ports: ['127.0.0.1:8767:8000']
    volumes: ['${TM_V25_STATE_DIR:?Use a separate V24 state directory}:/state']
    networks: [database]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  calendar:
    image: telegram-manager-calendar:V25
    env_file: '${TM_V25_CALENDAR_ENV_FILE:?Use the least-privilege CalDAV DSN file}'
    ports: ['127.0.0.1:5232:5232']
    networks: [database]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
networks:
  database:
    external: true
    name: '${TM_V25_DATABASE_NETWORK:?Use the inspected existing Docker database network}'
