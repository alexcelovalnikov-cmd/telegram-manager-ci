name: telegram-manager
services:
  db:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    env_file: /opt/telegram-manager/secrets/database.env
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, log_statement=none, -c, log_min_error_statement=panic]
    volumes:
      - /opt/telegram-manager/database:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d telegram_manager']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  db-rest:
    image: postgrest/postgrest:v14.1@sha256:e9490aa503a5fb07d8e8c80da46e5c0c193894e583b59ed9077e74c4101ffae2
    restart: unless-stopped
    env_file: /opt/telegram-manager/secrets/postgrest.env
    depends_on:
      db: {condition: service_healthy}
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  database:
    internal: true
