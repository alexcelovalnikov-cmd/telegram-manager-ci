<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram Manager — сверка</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;padding:20px}header{display:flex;gap:10px;align-items:center;font-size:14px;color:#aaa;margin-bottom:16px}.logo{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#229ed9;color:white}article{padding:22px;background:#1b1b1b;border:1px solid #343434;border-radius:20px}h1{font-size:22px;line-height:1.35;margin:0 0 12px;overflow-wrap:anywhere}.context{font-size:15px;line-height:1.55;color:#bdbdbd;white-space:pre-wrap}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}button{font:600 15px inherit;font-family:inherit;font-size:15px;padding:12px 16px;border-radius:12px;border:1px solid #454545;background:#292929;color:#f5f5f5;cursor:pointer}button[aria-pressed=true]{background:#0a84ff;border-color:#0a84ff;color:#fff}button:disabled{cursor:default;opacity:1}button:focus-visible{outline:2px solid white;outline-offset:3px}.status{font-size:13px;color:#aaa;line-height:1.5;margin:16px 0 0}.error{color:#ffb4ab}#recovery{display:flex;gap:10px;margin-top:12px}#recovery:empty{display:none}.empty{color:#bdbdbd;padding:20px 0}@media(max-width:420px){body{padding:12px}article{padding:18px}.actions button{flex:1 1 auto}h1{font-size:20px}}

.preview{margin:16px 0;padding:12px;border:1px solid #555;border-radius:12px}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.45 ui-monospace,monospace}.group,.source{font-weight:600}.actions button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}body[data-theme="light"]{background:#fff;color:#161616}body[data-theme="light"] article{background:#f7f7f7;color:#161616}body[data-theme="light"] .context{color:#333}
</style></head><body><header><span class="logo" aria-hidden="true">➤</span>Telegram Manager · Сверка</header><main id="card"><p class="empty">Загружаю текущий вопрос…</p></main><p id="status" class="status" role="status" aria-live="polite"></p><div id="recovery"></div>
<script>__CONTROLLER__</script>
<script>
'use strict';
let serial=0;const calls=new Map();let initialized=false;
function request(method,params){return new Promise((resolve,reject)=>{const id=++serial;const timer=setTimeout(()=>{calls.delete(id);reject(new Error('bridge_timeout'));},30000);calls.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
const bridge={uuid:()=>crypto.randomUUID().replaceAll('-',''),
 tool:async(name,args)=>{await ready;return request('tools/call',{name,arguments:args});},
 context:async(data)=>{await ready;return request('ui/update-model-context',{structuredContent:data});},
 message:async(text)=>{await ready;return request('ui/message',{role:'user',content:[{type:'text',text}]});}};
const card=document.getElementById('card'),status=document.getElementById('status'),recovery=document.getElementById('recovery');
function paint(s){
 if(!s.view)return;
 card.replaceChildren();recovery.replaceChildren();
 const settings=s.view.display_profile?.settings||{};
 const accent=/^#[0-9a-f]{6}$/i.test(settings.accent_color||'')?settings.accent_color:'#0a84ff';
 document.documentElement.style.setProperty('--accent',accent);
 document.querySelector('header').textContent=settings.title||'Telegram Manager · Сверка';
 document.body.dataset.theme=settings.theme==='light'?'light':'dark';
 const q=s.view.question;
 if(q){
  const article=document.createElement('article'),h=document.createElement('h1');h.textContent=q.title;article.append(h);
  const blocks={};
  function paragraph(key,value){if(value){const p=document.createElement('p');p.className='context '+key;p.textContent=String(value);blocks[key]=p;}}
  if(settings.show_group!==false)paragraph('group',q.group);
  if(settings.show_source_person!==false)paragraph('source',typeof q.source==='string'?q.source:q.source?.sender_name||q.source?.name||q.source?.chat_name);
  paragraph('context',q.context);if(settings.show_why_uncertain!==false)paragraph('uncertainty',q.uncertainty);
  if(settings.show_concrete_action!==false)paragraph('action',q.proposed_action);
  const order=Array.isArray(settings.item_order)?settings.item_order:['group','source','context','uncertainty','action'];
  for(const key of [...new Set([...order,'context'])])if(blocks[key])article.append(blocks[key]);
  for(const option of q.options){if(option.mutation_preview){
    const section=document.createElement('section'),title=document.createElement('strong');title.textContent=option.label;section.className='preview';section.append(title);
    for(const change of option.mutation_preview.changes||[]){
      const name=document.createElement('p');name.textContent=change.operation+' · '+change.entity+(change.target_id?' '+change.target_id:'');section.append(name);
      for(const delta of change.diff||[]){const line=document.createElement('pre');line.textContent=delta.path+'\n'+(Object.hasOwn(delta,'before')?JSON.stringify(delta.before,null,2):'(отсутствует)')+'\n→ '+(Object.hasOwn(delta,'after')?JSON.stringify(delta.after,null,2):'(удалено)');section.append(line);}
    }
    if(option.disabled){const warning=document.createElement('p');warning.textContent='Предложение устарело или уже применено. Нужен новый preview.';section.append(warning);}
    article.append(section);
  }}
  const actions=document.createElement('div');actions.className='actions';
  q.options.forEach((option,index)=>{const b=document.createElement('button');b.textContent=option.label;b.setAttribute('aria-pressed',String(index===s.selected));b.disabled=s.busy||!!s.pending||option.disabled===true;b.onclick=()=>controller.choose(index);actions.append(b);});
  article.append(actions);card.append(article);
 }else{const empty=document.createElement('p');empty.className='empty';empty.textContent=settings.manual_empty_text||'Сейчас обязательных решений нет.';card.append(empty);}
 status.className='status'+(s.error?' error':'');status.textContent=s.error||(s.busy?'Передаю ответ и проверяю результат…':s.waiting?'Продолжите уточнение в чате. Этот вопрос остаётся активным.':'');
 if(s.error){const retry=document.createElement('button');retry.textContent=s.stale?'Обновить вопрос':s.pending?.committed?'Загрузить следующий вопрос':'Повторить';retry.disabled=s.busy;retry.onclick=()=>s.stale?controller.refresh():controller.retry();recovery.append(retry);}
 notify('ui/notifications/size-changed',{height:document.documentElement.scrollHeight});
}

const cached=window.openai?.widgetState?.reviewState;
const controller=new ReviewController(bridge,paint,state=>{window.openai?.setWidgetState?.({reviewState:state});},cached);
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(m?.jsonrpc!=='2.0')return;
 if(calls.has(m.id)){const p=calls.get(m.id);calls.delete(m.id);clearTimeout(p.timer);m.error?p.reject(new Error('bridge_rejected')):p.resolve(m.result);return;}
 if(m.method==='ui/notifications/tool-result'){try{controller.snapshot(m.params);}catch(e){status.textContent='Не удалось загрузить вопрос.';}}
});
const ready=request('ui/initialize',{appInfo:{name:'Telegram Manager',version:'V24'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{initialized=true;notify('ui/notifications/initialized',{});});
ready.then(()=>{if(cached){controller.emit();if(cached.pending){controller.state.error='Проверьте результат предыдущего ответа.';controller.emit();}}else if(window.openai?.toolOutput)controller.snapshot(window.openai.toolOutput);}).catch(()=>{status.textContent='Откройте сверку внутри чата Telegram Manager, чтобы отвечать кнопками.';});
setInterval(()=>{if(initialized&&document.visibilityState!=='hidden')controller.poll();},5000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')controller.poll();});
</script></body></html>
