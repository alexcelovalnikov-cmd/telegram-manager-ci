<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram Manager — Сверка 2.0</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#f5f5f5;--accent:#0a84ff}*{box-sizing:border-box}body{margin:0;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-weight:700}.meta{font-size:13px;color:#aaa}.list{display:grid;gap:12px}.card{background:#1b1b1b;border:1px solid #343434;border-radius:18px;padding:18px}.card.focused{border-color:var(--accent)}h2{font-size:18px;line-height:1.35;margin:0 0 8px}.line{font-size:14px;line-height:1.5;color:#c8c8c8;white-space:pre-wrap;margin:6px 0}.label{font-weight:700;color:#eee}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{font:600 14px inherit;font-family:inherit;padding:10px 14px;border-radius:11px;border:1px solid #454545;background:#292929;color:#f5f5f5;cursor:pointer}button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.5;cursor:default}.preview{margin:12px 0;padding:11px;border:1px solid #4b4b4b;border-radius:11px}.preview pre{font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:22px;color:#bbb;text-align:center}.status{font-size:13px;color:#aaa;margin-top:12px}.error{color:#ffb4ab}.toolbar{display:flex;gap:8px;align-items:center}.toolbar button{padding:8px 11px}.warn{font-size:13px;color:#ffc46b;margin:8px 0}body[data-theme=light]{background:#fff;color:#161616}body[data-theme=light] .card{background:#f7f7f7;color:#161616}body[data-theme=light] .line{color:#333}
@media(max-width:520px){body{padding:12px}.card{padding:15px}.actions button{flex:1 1 auto}}
</style></head><body><header><div><div class="brand">Telegram Manager · Сверка 2.0</div><div id="meta" class="meta"></div></div><div class="toolbar"><button id="refresh">Обновить</button></div></header><main id="list" class="list"><div class="empty">Загружаю сверку…</div></main><p id="status" class="status" role="status" aria-live="polite"></p>
<script>__CONTROLLER__</script>
<script>
'use strict';
let serial=0;const calls=new Map();let initialized=false;
function request(method,params){return new Promise((resolve,reject)=>{const id=++serial;const timer=setTimeout(()=>{calls.delete(id);reject(new Error('bridge_timeout'));},30000);calls.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
const bridge={uuid:()=>crypto.randomUUID().replaceAll('-',''),tool:async(name,args)=>{await ready;return request('tools/call',{name,arguments:args});},context:async(data)=>{await ready;return request('ui/update-model-context',{structuredContent:data});},message:async(text)=>{await ready;return request('ui/message',{role:'user',content:[{type:'text',text}]});}};
const list=document.getElementById('list'),status=document.getElementById('status'),meta=document.getElementById('meta'),refresh=document.getElementById('refresh');
function textLine(parent,label,value){if(value){const p=document.createElement('p');p.className='line';const b=document.createElement('span');b.className='label';b.textContent=label+' ';p.append(b,document.createTextNode(String(value)));parent.append(p);}}
function paint(s){
 if(!s.view)return;
 const settings=s.view.display_profile?.settings||{};const accent=/^#[0-9a-f]{6}$/i.test(settings.accent_color||'')?settings.accent_color:'#0a84ff';document.documentElement.style.setProperty('--accent',accent);document.body.dataset.theme=settings.theme==='light'?'light':'dark';
 const items=s.view.findings||[];meta.textContent=items.length+(s.view.has_more?' +':'')+' пунктов';refresh.disabled=s.busy||s.refreshing||!!s.pending;list.replaceChildren();
 if(s.view.legacy_active){const w=document.createElement('div');w.className='warn';w.textContent='Есть активный вопрос старой сверки. Новый пункт нельзя применить, пока он не завершён.';list.append(w);}
 if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='Сейчас в сверке нет открытых пунктов.';list.append(e);}
 items.forEach((f,fi)=>{const card=document.createElement('article');card.className='card'+(f.focused?' focused':'');const h=document.createElement('h2');h.textContent=f.title;card.append(h);textLine(card,'Группа:',f.group);textLine(card,'Контекст:',f.context);textLine(card,'Почему требует внимания:',f.uncertainty);textLine(card,'Предлагаемое действие:',f.proposed_action);
  (f.options||[]).forEach(o=>{if(o.mutation_preview){const box=document.createElement('section');box.className='preview';const strong=document.createElement('strong');strong.textContent=o.label;box.append(strong);for(const change of o.mutation_preview.changes||[]){const n=document.createElement('p');n.className='line';n.textContent=change.operation+' · '+change.entity+(change.target_id?' '+change.target_id:'');box.append(n);for(const d of change.diff||[]){const pre=document.createElement('pre');pre.textContent=d.path+'\n'+(Object.hasOwn(d,'before')?JSON.stringify(d.before,null,2):'(отсутствует)')+'\n→ '+(Object.hasOwn(d,'after')?JSON.stringify(d.after,null,2):'(удалено)');box.append(pre);}}if(o.disabled){const w=document.createElement('p');w.className='warn';w.textContent='Предложение устарело. Нужен новый preview.';box.append(w);}card.append(box);}});
  const actions=document.createElement('div');actions.className='actions';(f.options||[]).forEach((o,oi)=>{const b=document.createElement('button');b.textContent=o.label;b.setAttribute('aria-pressed',String(s.selected===fi+':'+oi));b.disabled=s.busy||s.refreshing||!!s.pending||o.disabled===true;b.onclick=()=>controller.choose(fi,oi);actions.append(b);});card.append(actions);list.append(card);});
 status.className='status'+(s.error?' error':'');status.textContent=s.error||(s.busy?'Передаю выбранное действие и проверяю результат…':s.refreshing?'Обновляю сверку…':'');notify('ui/notifications/size-changed',{height:document.documentElement.scrollHeight});
}
const cached=window.openai?.widgetState?.reconciliationState;const controller=new ReconciliationController(bridge,paint,state=>window.openai?.setWidgetState?.({reconciliationState:state}),cached);refresh.onclick=()=>controller.refresh();
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(m?.jsonrpc!=='2.0')return;if(calls.has(m.id)){const p=calls.get(m.id);calls.delete(m.id);clearTimeout(p.timer);m.error?p.reject(new Error('bridge_rejected')):p.resolve(m.result);return;}if(m.method==='ui/notifications/tool-result'){try{controller.snapshot(m.params);}catch(e){status.textContent='Не удалось загрузить сверку.';}}});
const ready=request('ui/initialize',{appInfo:{name:'Telegram Manager',version:'V32'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{initialized=true;notify('ui/notifications/initialized',{});});
ready.then(()=>{if(cached){controller.emit();if(cached.pending){controller.state.error='Проверьте результат предыдущего действия.';controller.emit();}}else if(window.openai?.toolOutput)controller.snapshot(window.openai.toolOutput);}).catch(()=>{status.textContent='Откройте сверку внутри чата Telegram Manager.';});
</script></body></html>
